# Mosquitto broker for the home automation core.
#
# Anonymous access is off. Create the password file once, before first start:
#
#   docker run --rm -it -v "$PWD/deploy/mosquitto/config:/mosquitto/config" \
#     eclipse-mosquitto:2 mosquitto_passwd -c -b /mosquitto/config/passwd USER PASS
#
# Use the same USER/PASS as MQTT_USERNAME/MQTT_PASSWORD in deploy/.env.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

allow_anonymous false
password_file /mosquitto/config/passwd

listener 1883
protocol mqtt

listener 9001
protocol websockets

# TLS on 8883. Enable once certificates exist - self-signed is fine on a LAN.
# Devices that cannot do TLS keep using 1883; do not expose 1883 beyond the LAN.
#
# listener 8883
# protocol mqtt
# cafile   /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile  /mosquitto/config/certs/server.key
