name: Home Platform

# Covers the home automation work: the stack health check, the homestead
# registry and its SQL migrations, and the deployment compose file.
#
# Deliberately scoped to these paths and these test files rather than running
# `pytest tests/`. The ComfyUI side currently fails at collection because
# requirements.txt allows mcp 2.x, where FastMCP was renamed - that is tracked
# separately and must not mask a real failure here.

on:
  push:
    branches: [main, master, "claude/**"]
    paths:
      - "homestead/**"
      - "scripts/**"
      - "deploy/**"
      - "tests/test_stack_check.py"
      - "tests/test_homestead_registry.py"
      - ".github/workflows/home-platform.yml"
  pull_request:
    paths:
      - "homestead/**"
      - "scripts/**"
      - "deploy/**"
      - "tests/test_stack_check.py"
      - "tests/test_homestead_registry.py"
      - ".github/workflows/home-platform.yml"
  workflow_dispatch:

jobs:
  health-check:
    name: Stack health check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # stack_check.py is standard library only by design, so it can run on a
      # bare Windows Python with no pip step. Installing nothing but pytest
      # here keeps that promise honest - if an import creeps in, this fails.
      - name: Install pytest only
        run: python -m pip install --upgrade pip pytest

      - name: Run stack check tests
        run: pytest tests/test_stack_check.py -v

      - name: Verify the health check runs and reports failure cleanly
        run: |
          # Nothing is listening, so every required probe should fail and the
          # exit status should be 1. A crash or a 0 here is the real bug.
          python scripts/stack_check.py --timeout 1 --no-colour --json > report.json \
            && { echo "expected exit 1 with no services up"; exit 1; }
          python -c "
          import json
          report = json.load(open('report.json'))
          names = {r['name'] for r in report['results']}
          assert 'Mosquitto (MQTT)' in names, names
          assert all(r['status'] in {'OK', 'FAIL', 'SKIP'} for r in report['results'])
          print(f\"{len(report['results'])} probes reported\")
          "

  registry:
    name: Homestead registry
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "psycopg[binary]"

      - name: Apply migrations to a fresh database
        run: |
          psql -c "CREATE DATABASE homestead;"
          for f in homestead/sql/*.sql; do
            echo "--- $f"
            psql -d homestead -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # The seed files guard with anti-joins rather than ON CONFLICT, because
      # compatibility_rules has no unique constraint on subject by design. This
      # step is the regression guard for that: re-applying must not duplicate.
      - name: Migrations must be idempotent
        run: |
          before=$(psql -qtA -d homestead -c "SELECT count(*) FROM compatibility_rules;")
          for pass in 2 3; do
            for f in homestead/sql/*.sql; do
              psql -d homestead -v ON_ERROR_STOP=1 -q -f "$f"
            done
          done
          after=$(psql -qtA -d homestead -c "SELECT count(*) FROM compatibility_rules;")
          echo "compatibility_rules: $before -> $after after two more passes"
          if [ "$before" != "$after" ]; then
            echo "::error::Migrations are not idempotent: $before became $after"
            exit 1
          fi
          # Equipment is the other table migrations write to, and a rename
          # across two migrations is exactly how a duplicate row creeps in.
          cameras=$(psql -qtA -d homestead -c \
            "SELECT count(*) FROM equipment WHERE name ILIKE '%NiView%';")
          stale=$(psql -qtA -d homestead -c \
            "SELECT count(*) FROM equipment WHERE name ILIKE '%Solar dual-linkage%';")
          echo "camera rows: niview=$cameras stale=$stale"
          [ "$cameras" = "1" ] || { echo "::error::expected exactly one camera row, got $cameras"; exit 1; }
          [ "$stale" = "0" ] || { echo "::error::stale camera name survived"; exit 1; }

      - name: Upgrade path from a pre-correction database
        run: |
          # A database seeded before the camera correction carries the old
          # subject. Applying the full set must converge on one scoped row,
          # not leave a duplicate behind.
          psql -c "CREATE DATABASE upgrade_check;"
          psql -d upgrade_check -v ON_ERROR_STOP=1 -q -f homestead/sql/001_schema.sql
          psql -d upgrade_check -q -c \
            "INSERT INTO compatibility_rules (subject, verdict) \
             VALUES ('SONOFF cameras (ONVIF/RTSP)', 'works_with_caveats');"
          for f in homestead/sql/*.sql; do
            psql -d upgrade_check -v ON_ERROR_STOP=1 -q -f "$f"
          done
          stale=$(psql -qtA -d upgrade_check -c \
            "SELECT count(*) FROM compatibility_rules \
             WHERE subject = 'SONOFF cameras (ONVIF/RTSP)';")
          scoped=$(psql -qtA -d upgrade_check -c \
            "SELECT count(*) FROM compatibility_rules \
             WHERE subject LIKE 'SONOFF-branded cameras%';")
          echo "stale=$stale scoped=$scoped"
          [ "$stale" = "0" ] || { echo "::error::stale subject survived"; exit 1; }
          [ "$scoped" = "1" ] || { echo "::error::expected exactly one scoped row"; exit 1; }

      - name: Run registry tests
        env:
          HOMESTEAD_TEST_DSN: "host=localhost port=5432 user=postgres password=postgres dbname=homestead_test"
        run: |
          psql -c "CREATE DATABASE homestead_test;"
          pytest tests/test_homestead_registry.py -v

  deploy-config:
    name: Deployment compose file
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compose file must be valid and fully resolvable
        working-directory: deploy
        run: |
          # .env is gitignored, so build one from the committed example. This
          # also proves .env.example declares every variable the compose file
          # requires - a missing one makes `docker compose config` fail here
          # rather than on the user's machine at 11pm.
          cp .env.example .env
          docker compose config --quiet
          echo "compose file resolves with only .env.example values"

      - name: Zigbee2MQTT config must be valid YAML with the right adapter
        run: |
          python - <<'PY'
          import yaml
          cfg = yaml.safe_load(open("deploy/zigbee2mqtt/configuration.yaml"))
          serial = cfg["serial"]
          # The MG24 runs EmberZNet. 'ezsp' is deprecated and 'zstack' is for
          # the CC2652-based ZBDongle-P; either produces confusing failures.
          assert serial["adapter"] == "ember", serial
          assert cfg["permit_join"] is False, "joining must stay closed by default"
          assert cfg["mqtt"]["server"].startswith("mqtt://"), cfg["mqtt"]
          print("zigbee2mqtt config OK:", serial)
          PY
